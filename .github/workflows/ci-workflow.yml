name: Compilation & tests

on:
  workflow_dispatch:
    inputs:
      golden_run:
        type: choice
        required: true
        default: 'Raise an error (default)'
        description: CI behavior if the test snapshots are different than expected.
        options:
          - 'Raise an error (default)'
          - 'Open a PR'
  push:
    branches:
      - master
      - develop
  pull_request:

permissions:
  contents: write       # Needed for snapshot PR creation in ragger/swap tests
  actions: write        # Needed for upload-artifact in build and test workflows
  pull-requests: write  # Needed for PR comments and snapshot PR creation

# Cancel previous runs on this reference
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_application:
    name: Build application using the reusable workflow
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_build.yml@v1
    with:
      upload_app_binaries_artifact: compiled_app_binaries
      flags: "TRUSTED_NAME_TEST_KEY=1"
      build_comparison: true
      enable_stack_consumption: true

  standalone_tests:
    name: Run ragger tests using the reusable workflow
    needs: build_application
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_ragger_tests.yml@v1
    with:
      download_app_binaries_artifact: compiled_app_binaries
      regenerate_snapshots: ${{ inputs.golden_run == 'Open a PR' }}
      test_dir: "tests/python"
      post_stack_consumption: true

  tests_swap:
    name: Run swap tests using the reusable workflow
    needs: build_application
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_swap_tests.yml@v1
    with:
      download_app_binaries_artifact: compiled_app_binaries
      regenerate_snapshots: ${{ github.event_name == 'workflow_dispatch' && inputs.golden_run == 'Open a PR' }}

  job_C_test:
    name: C tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder-lite:latest
    steps:
      - name: Clone
        uses: actions/checkout@v3
      - name: Build unit tests
        run: make -C libsol

  build_mem_app:
    name: Build Memory application using the reusable workflow
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_build.yml@v1
    with:
      upload_app_binaries_artifact: "memory_elfs"
      flags: "memory_profiling"
      run_for_devices: '["flex"]'

  ragger_mem_tests:
    name: Run Memory tests using the reusable workflow
    needs: build_mem_app
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_ragger_tests.yml@v1
    with:
      download_app_binaries_artifact: "memory_elfs"
      run_for_devices: '["flex"]'
      upload_snapshots_on_failure: false
      capture_file: pytest-logs-combined

  ragger_mem_results:
    name: Process pytest logs
    if: always()
    needs: ragger_mem_tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Download and process pytest logs
        if: always()
        uses: actions/download-artifact@v7
        with:
          name: pytest-logs-combined
          path: logs

      - name: Process logs with valground
        if: always()
        run: |
          if [ -f logs/pytest-logs-combined.log ]; then
            cat logs/pytest-logs-combined.log | tools/valground.py -q
          fi
