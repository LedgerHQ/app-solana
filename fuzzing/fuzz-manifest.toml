[target]
fuzzer = "fuzz_app"
harness_version = "1"

[coverage]
key_files = [
    "src/apdu.c",
    "src/handle_get_pubkey.c",
    "src/handle_get_challenge.c",
    "src/handle_sign_message.c",
    "src/handle_sign_message_preview.c",
    "src/handle_sign_offchain_message.c",
    "src/handle_provide_instruction_descriptor.c",
    "src/handle_provide_trusted_info.c",
    "src/handle_provide_dynamic_descriptor.c",
    "src/dynamic_token_info.c",
    "src/trusted_info.c",
    "src/ed25519_helpers.c",
    "src/utils.c",
    "src/swap/handle_check_address.c",
    "src/swap/handle_get_printable_amount.c",
    "src/swap/handle_swap_sign_transaction.c",
    "libsol/parser.c",
    "libsol/message.c",
    "libsol/instruction.c",
    "libsol/print_config.c",
    "libsol/printer.c",
    "libsol/stake_instruction.c",
    "libsol/spl_token_instruction.c",
    "libsol/spl_token2022_instruction.c",
    "libsol/spl_associated_token_account_instruction.c",
    "libsol/spl_memo_instruction.c",
    "libsol/system_instruction.c",
    "libsol/vote_instruction.c",
    "libsol/compute_budget_instruction.c",
    "libsol/serum_assert_owner_instruction.c",
    "libsol/offchain_message_signing.c",
    "libsol/rfc3339.c",
    "libsol/string_utils.c",
]
exclude_regexes = [
    '.*ledger-secure-sdk.*',
    '.*fuzz_dispatcher\.c',
    '.*fuzzer\.c',
    '.*fuzzing/mock/.*',
    '.*fuzzing-libsol-legacy/.*',
    '.*libsol/.*_test\.c',
    '.*libsol/mock/.*',
    '.*src/main_application\.c',
    '.*src/ui/.*',
]

[dictionary]
